{% extends "base.html" %}

{% block title %}長庚大學選課系統{% endblock %}

{% block content %}
<div class="text-center py-12">
    <h1 class="text-4xl font-bold text-[#333333] mb-4">🎓 長庚大學選課視覺化系統</h1>
    <p class="text-gray-600 text-lg mb-8">畢業學分計算與選課建議</p>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 max-w-5xl mx-auto">
        <!-- 已修課程卡片 -->
        <a href="/courses" class="block bg-white rounded-xl shadow-md hover:shadow-lg transition p-6 border-l-4 border-[#E39800] hover:border-[#C48400]">
            <div class="text-3xl mb-3">📚</div>
            <h2 class="text-xl font-semibold text-[#333333]">已修課程</h2>
            <p class="text-gray-500 text-sm mt-2">查看已修課程清單與學分統計</p>
        </a>

        <!-- 開課查詢卡片 -->
        <a href="/catalog" class="block bg-white rounded-xl shadow-md hover:shadow-lg transition p-6 border-l-4 border-green-500 hover:border-green-600">
            <div class="text-3xl mb-3">🔍</div>
            <h2 class="text-xl font-semibold text-[#333333]">開課查詢</h2>
            <p class="text-gray-500 text-sm mt-2">查詢課程時間、教師與學分資訊</p>
        </a>

        <!-- 畢業進度卡片 -->
        <a href="/catalog" class="block bg-white rounded-xl shadow-md hover:shadow-lg transition p-6 border-l-4 border-purple-500 hover:border-purple-600">
            <div class="text-3xl mb-3">📊</div>
            <h2 class="text-xl font-semibold text-[#333333]">畢業進度</h2>
            <p class="text-gray-500 text-sm mt-2">追蹤畢業學分完成狀況</p>
        </a>

        <!-- 選課建議卡片 -->
        <a href="/catalog" class="block bg-white rounded-xl shadow-md hover:shadow-lg transition p-6 border-l-4 border-[#C48400] hover:border-[#333333]">
            <div class="text-3xl mb-3">💡</div>
            <h2 class="text-xl font-semibold text-[#333333]">選課建議</h2>
            <p class="text-gray-500 text-sm mt-2">根據畢業規則推薦下學期課程</p>
        </a>
    </div>

    <div class="mt-12 bg-orange-50 border border-orange-200 rounded-lg p-4 max-w-2xl mx-auto">
        <p class="text-orange-700 text-sm">
            ⚠️ 本系統資料僅供參考，正式畢業資格以系辦與教務處認定為準。
        </p>
    </div>
</div>
{% endblock %}
