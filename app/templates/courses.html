{% extends "base.html" %}

{% block title %}已修課程 - 長庚大學選課系統{% endblock %}

{% block content %}
<div x-data="coursesApp()">
    <div class="flex flex-col gap-4 mb-6 md:flex-row md:items-start md:justify-between">
        <div>
            <h1 class="text-3xl font-bold text-[#333333]">已修課程</h1>
            <p class="text-sm text-gray-500 mt-2" x-show="lastSyncedAt">
                最後同步：<span x-text="formatDateTime(lastSyncedAt)"></span>
            </p>
        </div>
        <div class="bg-white rounded-lg shadow border border-gray-200 p-4 w-full md:w-80">
            <button type="button"
                    @click="showRefreshForm = !showRefreshForm"
                    class="w-full bg-[#E39800] hover:bg-[#C48400] text-white font-semibold px-4 py-2 rounded-lg transition disabled:opacity-60"
                    :disabled="refreshing">
                <span x-show="!refreshing">刷新重抓校務成績</span>
                <span x-show="refreshing">同步中，請稍候...</span>
            </button>
            <form x-show="showRefreshForm" x-cloak @submit.prevent="refreshCourses()" class="mt-3 space-y-2">
                <input type="password"
                       x-model="refreshPassword"
                       autocomplete="current-password"
                       placeholder="輸入 M365 密碼"
                       class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-[#E39800] focus:border-transparent">
                <button type="submit"
                        :disabled="refreshing || !refreshPassword"
                        class="w-full bg-gray-700 hover:bg-gray-800 disabled:opacity-50 text-white font-medium px-4 py-2 rounded-lg transition">
                    確認刷新
                </button>
                <p x-show="refreshError" x-text="refreshError" class="text-sm text-red-600"></p>
                <p x-show="refreshMessage" x-text="refreshMessage" class="text-sm text-green-600"></p>
            </form>
        </div>
    </div>

    <!-- 學分統計卡片 -->
    <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-8">
        <div class="bg-white rounded-lg shadow p-4 border-t-4 border-[#E39800]">
            <div class="text-sm text-gray-500">總學分</div>
            <div class="text-2xl font-bold text-[#E39800]" x-text="totalCredits">-</div>
        </div>
        <div class="bg-white rounded-lg shadow p-4 border-t-4 border-green-500">
            <div class="text-sm text-gray-500">已通過學分</div>
            <div class="text-2xl font-bold text-green-600" x-text="passedCredits">-</div>
        </div>
        <div class="bg-white rounded-lg shadow p-4 border-t-4 border-purple-500">
            <div class="text-sm text-gray-500">修習中學分</div>
            <div class="text-2xl font-bold text-purple-600" x-text="inProgressCredits">-</div>
        </div>
        <div class="bg-white rounded-lg shadow p-4 border-t-4 border-[#333333]">
            <div class="text-sm text-gray-500">課程數</div>
            <div class="text-2xl font-bold text-[#333333]" x-text="courseCount">-</div>
        </div>
    </div>

    <!-- 篩選區 -->
    <div class="bg-white rounded-lg shadow p-4 mb-6 border border-gray-200">
        <div class="flex flex-wrap gap-4 items-center">
            <div>
                <label class="text-sm text-gray-500">學年</label>
                <select x-model="filterYear" class="border border-gray-300 rounded px-3 py-1 ml-2 text-gray-700 focus:ring-2 focus:ring-[#E39800] focus:border-transparent">
                    <option value="">全部</option>
                    <template x-for="year in availableYears" :key="year">
                        <option :value="year" x-text="year"></option>
                    </template>
                </select>
            </div>
            <div>
                <label class="text-sm text-gray-500">學期</label>
                <select x-model="filterTerm" class="border border-gray-300 rounded px-3 py-1 ml-2 text-gray-700 focus:ring-2 focus:ring-[#E39800] focus:border-transparent">
                    <option value="">全部</option>
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3（暑修）</option>
                </select>
            </div>
            <div>
                <label class="text-sm text-gray-500">狀態</label>
                <select x-model="filterStatus" class="border border-gray-300 rounded px-3 py-1 ml-2 text-gray-700 focus:ring-2 focus:ring-[#E39800] focus:border-transparent">
                    <option value="">全部</option>
                    <option value="passed">已通過</option>
                    <option value="failed">未通過</option>
                    <option value="in_progress">修習中</option>
                </select>
            </div>
            <button @click="resetFilters()" class="text-[#E39800] hover:text-[#C48400] text-sm">
                重設篩選
            </button>
        </div>
    </div>

    <!-- 課程表格 -->
    <div class="bg-white rounded-lg shadow overflow-hidden border border-gray-200">
        <table class="min-w-full divide-y divide-gray-200">
            <thead class="bg-gray-50">
                <tr>
                    <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">學年學期</th>
                    <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">課程名稱</th>
                    <th class="px-4 py-3 text-center text-xs font-medium text-gray-500 uppercase">學分</th>
                    <th class="px-4 py-3 text-center text-xs font-medium text-gray-500 uppercase">成績</th>
                    <th class="px-4 py-3 text-center text-xs font-medium text-gray-500 uppercase">狀態</th>
                </tr>
            </thead>
            <tbody class="bg-white divide-y divide-gray-200">
                <template x-for="course in filteredCourses" :key="course.課程名稱 + course.學年學期">
                    <tr class="hover:bg-orange-50">
                        <td class="px-4 py-3 text-sm text-gray-700" x-text="formatSemester(course.學年學期)"></td>
                        <td class="px-4 py-3 text-sm font-medium text-gray-900" x-text="course.課程名稱"></td>
                        <td class="px-4 py-3 text-sm text-center text-gray-700" x-text="course.學分數"></td>
                        <td class="px-4 py-3 text-sm text-center">
                            <span x-show="course.修課成績" x-text="course.修課成績" class="text-gray-700"></span>
                            <span x-show="!course.修課成績" class="text-gray-500">-</span>
                        </td>
                        <td class="px-4 py-3 text-sm text-center">
                            <span class="px-2 py-1 rounded text-xs font-medium"
                                  :class="getStatusClass(course)">
                                <span x-text="getStatusText(course)"></span>
                            </span>
                        </td>
                    </tr>
                </template>
            </tbody>
        </table>

        <!-- 空狀態 -->
        <div x-show="filteredCourses.length === 0" class="text-center py-12 text-gray-500">
            尚無修課資料，請先同步校務成績資料。
        </div>
    </div>

    <!-- 畢業進度 -->
    <div class="mt-8 bg-gradient-to-r from-[#E8E2D6] to-[#F9F9F9] rounded-xl p-6 border border-[#D1C7AC]">
        <h3 class="font-semibold text-[#333333] mb-4 text-lg">畢業進度</h3>
        <div class="flex items-center justify-between mb-2">
            <span class="text-gray-600">已修學分 / 畢業門檻</span>
            <span class="text-[#E39800] font-bold" x-text="passedCredits + ' / 128'"></span>
        </div>
        <div class="w-full bg-gray-200 rounded-full h-3">
            <div class="bg-gradient-to-r from-[#E39800] to-[#C48400] h-3 rounded-full transition-all duration-500"
                 :style="`width: ${Math.min(100, passedCredits / 128 * 100)}%`"></div>
        </div>
        <p class="text-sm text-gray-500 mt-2" x-text="`尚需 ${Math.max(0, 128 - passedCredits)} 學分達到畢業門檻`"></p>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
function coursesApp() {
    return {
        courses: [],
        filterYear: '',
        filterTerm: '',
        filterStatus: '',
        showRefreshForm: false,
        refreshing: false,
        refreshPassword: '',
        refreshError: '',
        refreshMessage: '',
        lastSyncedAt: '',

        async init() {
            try {
                const response = await fetch('/courses/data');
                const data = await response.json();
                this.courses = Array.isArray(data) ? data : (data.courses || []);
                this.lastSyncedAt = Array.isArray(data) ? '' : (data.last_synced_at || '');
            } catch (e) {
                console.error('載入課程資料失敗', e);
            }
        },

        async refreshCourses() {
            this.refreshing = true;
            this.refreshError = '';
            this.refreshMessage = '';

            try {
                const formData = new FormData();
                formData.append('password', this.refreshPassword);

                const response = await fetch('/courses/refresh', {
                    method: 'POST',
                    body: formData,
                });
                const data = await response.json();

                if (!response.ok || data.error) {
                    throw new Error(data.error || '同步失敗');
                }

                this.courses = data.courses || [];
                this.lastSyncedAt = data.last_synced_at || '';
                this.refreshPassword = '';
                this.refreshMessage = data.message || '已重新同步';
                this.showRefreshForm = false;
            } catch (e) {
                this.refreshError = e.message || '同步失敗';
            } finally {
                this.refreshing = false;
            }
        },


        get filteredCourses() {
            return this.courses
                .map((course, index) => ({ course, index }))
                .filter(({ course: c }) => {
                    const sem = c.學年學期 || '';
                    const year = sem.slice(0, 3);  // e.g., "114"
                    const term = sem.slice(3);     // e.g., "1" or "2"

                    if (this.filterYear && year !== this.filterYear) return false;
                    if (this.filterTerm && term !== this.filterTerm) return false;

                    if (this.filterStatus) {
                        const status = this.getCourseStatus(c);
                        if (status !== this.filterStatus) return false;
                    }

                    return true;
                })
                .sort((a, b) => {
                    const semA = a.course.學年學期 || '';
                    const semB = b.course.學年學期 || '';
                    return semB.localeCompare(semA) || a.index - b.index;
                })
                .map(({ course }) => course);
        },

        get totalCredits() {
            return this.filteredCourses
                .filter(c => this.getCourseStatus(c) !== 'failed')
                .reduce((sum, c) => sum + parseFloat(c.學分數 || 0), 0);
        },

        get passedCredits() {
            return this.courses
                .filter(c => this.isPassed(c.修課成績))
                .reduce((sum, c) => sum + parseFloat(c.學分數 || 0), 0);
        },

        get inProgressCredits() {
            return this.courses
                .filter(c => this.isInProgressScore(c.修課成績))
                .reduce((sum, c) => sum + parseFloat(c.學分數 || 0), 0);
        },

        get courseCount() {
            return this.filteredCourses.length;
        },

        get availableYears() {
            const years = new Set(this.courses.map(c => (c.學年學期 || '').slice(0, 3)));
            return [...years].filter(y => y).sort().reverse();
        },

        // 判斷是否通過
        isPassed(score) {
            if (!score) return false;
            score = score.trim().toUpperCase();
            if (['S', 'I'].includes(score)) return false;
            if (['P', '通過', '及格'].includes(score)) return true;
            const num = parseFloat(score);
            return !isNaN(num) && num >= 60;
        },

        isInProgressScore(score) {
            if (!score) return true;
            return score.trim().toUpperCase() === 'I';
        },

        // 取得課程狀態
        getCourseStatus(course) {
            const score = course.修課成績;
            if (this.isInProgressScore(score)) return 'in_progress';
            if (this.isPassed(score)) return 'passed';
            return 'failed';
        },

        // 格式化學期顯示
        formatSemester(sem) {
            if (!sem) return '-';
            const year = sem.slice(0, 3);
            const term = sem.slice(3);
            return `${year}學年第${term}學期`;
        },

        formatDateTime(value) {
            if (!value) return '';
            const date = new Date(value);
            if (Number.isNaN(date.getTime())) return value;
            return date.toLocaleString('zh-TW', { hour12: false });
        },

        // 取得狀態樣式
        getStatusClass(course) {
            const status = this.getCourseStatus(course);
            switch (status) {
                case 'passed':
                    return 'bg-green-100 text-green-800';
                case 'failed':
                    return 'bg-red-100 text-red-800';
                case 'in_progress':
                    return 'bg-yellow-100 text-yellow-800';
                default:
                    return 'bg-gray-100 text-gray-800';
            }
        },

        // 取得狀態文字
        getStatusText(course) {
            const status = this.getCourseStatus(course);
            switch (status) {
                case 'passed': return '已通過';
                case 'failed': return '未通過';
                case 'in_progress': return '修習中';
                default: return '未知';
            }
        },

        resetFilters() {
            this.filterYear = '';
            this.filterTerm = '';
            this.filterStatus = '';
        }
    }
}
</script>
{% endblock %}
